<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BUKAAA BLOKK WA ARIEL</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 16px;
    }

    /* Background Hearts */
    .bg-heart {
      position: absolute;
      color: rgba(56, 189, 248, 0.35);
      font-size: 20px;
      animation: floatUp 6s infinite linear;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Card Box */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(14, 165, 233, 0.2),
                  0 2px 10px rgba(255, 255, 255, 0.8) inset;
      border: 2px solid rgba(255, 255, 255, 0.9);
      position: relative;
      z-index: 10;
    }

    /* Photo Container */
    .img-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #38bdf8;
      box-shadow: 0 8px 16px rgba(56, 189, 248, 0.25);
      background-color: #f0f9ff;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      color: #0369a1;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #0284c7;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Action Area */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 120px;
      position: relative;
      width: 100%;
    }

    .btn-yes {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
      white-space: nowrap;
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    /* Tombol Enggak tetap di sekitaran area kartu */
    .btn-no {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #cbd5e1;
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      z-index: 10;
      white-space: nowrap;
      position: relative;
      transition: transform 0.15s ease-out;
      touch-action: none;
    }

    /* Polaroid Layout dengan Elemen Video Utuh */
    .polaroid {
      background: white;
      padding: 12px 12px 16px 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transform: rotate(-2deg);
      margin: 12px auto 16px;
      width: 90%;
    }

    .polaroid video {
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: contain; /* Video tampil utuh tanpa terpotong */
      border-radius: 8px;
      display: block;
      background-color: transparent;
    }

    .polaroid-caption {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #0369a1;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Card 1: Pertanyaan -->
  <div class="card" id="card-question">
    <div class="img-container">
      <!-- FOTO UTAMA 1 -->
      <img src="cat.jpg" alt="Foto Pacar" />
    </div>

    <h2>BUKA BLOK WA ARIEL</h2>
    <p class="subtitle">plissss maafin ariel iaa, buka cisu🥺</p>

    <div class="btn-group">
      <button class="btn-yes" id="btn-yes" onclick="forgiveMe()">iya,ku buka</button>
      <button class="btn-no" id="btn-no">enggak</button>
    </div>
  </div>

  <!-- Card 2: Setelah Dimaafkan -->
  <div class="card hidden" id="card-success">
    <h2>yeyyy di buka, maafin ariel iaaa</h2>
    <p class="subtitle">mangat ujiannn nyaa!!</p>
    
    <div class="polaroid">
      <!-- VIDEO POLAROID -->
      <video id="success-video" loop playsinline>
        <source src="yaya.mp4" type="video/mp4" />
        Browser kamu tidak mendukung pemutaran video.
      </video>
      <div class="polaroid-caption">Janji gak di ulangi lagi,kek nha akwkwk</div>
    </div>
  </div>

  <script>
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const successVideo = document.getElementById('success-video');
    let yesScale = 1;

    // Hati Mengapung Background
    function createBgHearts() {
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerHTML = '🩵';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.body.appendChild(heart);
      }
    }
    createBgHearts();

    // Fungsi Bergerak HANYA di Sekitaran Kartu
    function moveButton() {
      const maxOffsetHorizontal = 90; // Batas geser kiri/kanan
      const maxOffsetVertical = 60;   // Batas geser atas/bawah

      const randomX = (Math.random() * (maxOffsetHorizontal * 2)) - maxOffsetHorizontal;
      const randomY = (Math.random() * (maxOffsetVertical * 2)) - maxOffsetVertical;

      btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;

      // Pembesaran Tombol "Iya"
      yesScale += 0.25;
      btnYes.style.transform = `scale(${yesScale})`;
    }

    // Event Listener HP (Sentuh) & Laptop (Klik/Hover)
    btnNo.addEventListener('touchstart', function(e) {
      e.preventDefault();
      moveButton();
    });
    btnNo.addEventListener('mouseover', moveButton);
    btnNo.addEventListener('click', moveButton);

    // Fungsi Klik "Iya" + Putar Video
    function forgiveMe() {
      document.getElementById('card-question').classList.add('hidden');
      document.getElementById('card-success').classList.remove('hidden');

      // Putar video otomatis dengan suara
      if (successVideo) {
        successVideo.currentTime = 0;
        successVideo.muted = false; // Memastikan suara aktif
        successVideo.play().catch(error => {
          console.log("Autoplay video error:", error);
        });
      }

      // Efek Konfeti
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#38bdf8', '#0284c7', '#93c5fd', '#ffffff']
      });

      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#38bdf8', '#0284c7', '#93c5fd']
        });
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#38bdf8', '#0284c7', '#93c5fd']
        });
      }, 250);
    }
  </script>
</body>
</html>
